<div class="guess">

  @for (item of [].constructor(5); track $index) {

    @if (isTyping()) {
      <span class="character current">{{ paddedGuess()[$index] ?? "" }}</span>
    } @else if (isOldGuess())
    {
      <span class="character old {{ game.characterGuessStatus(guesses()[index][$index], $index) }}">{{ guesses()[index][$index] ?? "" }}</span>
    } @else {
      <span class="character"></span>
    }

  }
</div>
